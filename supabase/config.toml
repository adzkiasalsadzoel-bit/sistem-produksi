# Konfigurasi Supabase lokal (`npx supabase start`, butuh Docker Desktop)
project_id = "sistem-produksi-cetak"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[storage.buckets.previews]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# Staf dibuat oleh admin dari halaman Pengaturan — pendaftaran publik DIMATIKAN
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
